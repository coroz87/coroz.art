            overflow: hidden;
            width: 100%;
            height: 100%;
            border: none;
            box-sizing: border-box;
        }

        /* Gallery scroll arrows â€” GLightbox style */
        .gallery-arrow {
            display: none;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            width: 50px;
            height: 50px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 32px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: text-shadow 0.2s, transform 0.2s;
        }

        .gallery-arrow:hover {
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            transform: translateY(-50%) scale(1.15);
        }

        .gallery-arrow.arrow-left {
            left: -50px;
        }

        .gallery-arrow.arrow-right {
            right: -50px;
        }

        @media (max-width: 1300px) {
            .gallery-arrow.arrow-left {
                left: 0px;
            }

            .gallery-arrow.arrow-right {
                right: 0px;
            }
        }

        @media (min-width: 769px) {
            .gallery-arrow {
                display: inline-flex;
            }
        }

        .gallery-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 0;

            /* CSS Grid for predictable alternating masonry pattern */
            display: grid;
            grid-template-rows: repeat(2, calc(50% - 2.5px));
            /* Force exactly 50% height rows minus half the 5px gap */
            grid-auto-flow: column;
            /* Fill column by column left-to-right */
            grid-auto-columns: max-content;
            /* Size column to fit explicit item widths */
            gap: 5px;
            /* Tighter gap as requested */

            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
            /* Scrollbar styling for inner grid - Hidden */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .gallery-grid.active.grid-loaded {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        .gallery-grid:not(.active) {
            opacity: 0 !important;
            visibility: hidden !important;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .gallery-grid::-webkit-scrollbar {
            height: 6px;
            display: none;
        }

        .gallery-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .gallery-grid::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 10px;
        }

        /* Alternating grid masonry layout */
        .gallery-grid>a {
            display: flex;
            box-sizing: border-box;
            height: 100%;
            width: 100%;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
            background: #f0f0f0;
        }

        /* 1 complete (spans 2 full rows) */
        .gallery-grid>a:nth-child(3n+1) {
            grid-row: span 2;
            width: auto;
        }

        /* Natural aspect ratio for full-height single images */
        .gallery-grid>a:nth-child(3n+1) img {
            width: auto;
            height: 100%;
            object-fit: contain;
            background: #f0f0f0;
        }

        .gallery-grid img {
            flex: 1;
            min-height: 0;
            min-width: 0;
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 4px;
            object-fit: contain;
            background: #f0f0f0;
            cursor: pointer;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        @media (hover: hover) {
            .gallery-grid img:hover {
                transform: scale(1.05);
                /* Magnify effect */
            }
        }

        /* Bottom Slider wrapper */
        .subpage-main .projects-wrapper {
            flex-shrink: 0;
            height: 100px;
            /* Restored to exactly 100px */
            overflow: hidden;
            display: flex;
            align-items: center;
            margin-top: 10px;
            background: #fff;
        }

        .bottom-gallery-track {
            display: flex;
            height: 100%;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            /* Hide scrollbar */

            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .bottom-gallery-track.grid-loaded {
            opacity: 1;
            visibility: visible;
        }

        .bottom-gallery-track::-webkit-scrollbar {
            display: none;
        }

        /* Override global work_item height for this subpage */
        .subpage-main .work_item {
            height: 100px !important;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
        }

        /* Ensure link wrapper propagates height */
        .subpage-main .work_item a {
            display: block;
            height: 100%;
        }

        /* Ensure images inside shrink proportionally without cropping top/bottom */
        .subpage-main .work_item img {
            height: 100% !important;
            width: auto !important;
            /* Width auto ensures aspect-ratio constraint dynamically pulls in the sides */
            object-fit: contain !important;
            display: block !important;
            cursor: pointer;
            /* 'contain' fits entire image completely visible inside the 100px height limit */
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        /* Restore slider hover darkening and add zoom */
        @media (hover: hover) {
            .subpage-main .work_item:hover img {
                transform: scale(1.05) !important;
            }
        }

        /* Mobile specific adjustments */
        @media (max-width: 768px) {

            .subpage-main .projects-wrapper,
            .subpage-main .projects_wrapper,
            .projects-wrapper,
            .projects_wrapper {
                display: none !important;
            }

                overflow: hidden;
                position: relative;
            }

            }

                position: absolute;

                align-content: flex-start;
            }

            /* All items: dynamic height based on aspect ratio */
            .gallery-grid.active>a {
                width: calc(50% - 2.5px);
                height: auto;
                aspect-ratio: unset;
                overflow: hidden;
                background: #f0f0f0;

                height: auto;
                object-fit: contain;

            }

    <script>
        // Gallery Arrows
        (function () {
            var SCROLL_STEP = 420;
            var btnLeft = document.getElementById('gallery-arrow-left');
            var btnRight = document.getElementById('gallery-arrow-right');
            function activeGrid() { return document.querySelector('.gallery-grid.active'); }
            function smoothScroll(g, d) { g.scrollBy({ left: d, behavior: 'smooth' }); }
            btnLeft.addEventListener('click', function () { var g = activeGrid(); if (g) smoothScroll(g, -SCROLL_STEP); });
            btnRight.addEventListener('click', function () { var g = activeGrid(); if (g) smoothScroll(g, SCROLL_STEP); });
        })();
    </script>
