            }

        @media (min-width: 769px) {
            .gallery-arrow {
                display: inline-flex;
            }

        .gallery-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 0;
            display: grid;
            grid-template-rows: repeat(2, calc(50% - 2.5px));
            grid-auto-flow: column;
            grid-auto-columns: max-content;
            gap: 5px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .gallery-grid.active.grid-loaded {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        .gallery-grid>a {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 3/2;
            overflow: hidden;
            background: #f0f0f0;
        }

        .gallery-grid>a:nth-child(3n+1) {
            grid-row: span 2;
            width: auto;
        }

        .gallery-grid>a:nth-child(3n+1) img {
            width: auto;
            height: 100%;
            object-fit: contain;
            background: #f0f0f0;
        }

        .gallery-grid img {
            flex: 1;
            min-height: 0;
            min-width: 0;
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 4px;
            object-fit: contain;
            background: #f0f0f0;
            cursor: pointer;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        @media (hover: hover) {
            .gallery-grid img:hover {
                transform: scale(1.05);
            }
        }
