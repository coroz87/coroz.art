    <style>
        body {
            overflow: hidden;
        }

        .subpage-main {
            position: fixed;
            top: 60px;
            /* Claim the adjusted 60px header space */
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-bottom: 10px;
            /* Padding for slider at the bottom */
            background: #fff;
        }

        .subpage-main h2 {
            font-size: 32px;
            line-height: 1;
            flex-shrink: 0;
            margin: 0;
            text-align: left;
        }

        /* Top Header Area (Title + Tabs) */
        .top-header-area {
            display: flex;
            align-items: baseline;
            /* Align tabs onto same line as title */
            justify-content: space-between;
            padding: 38px 0 26px 0;
            width: 100%;
        }

        /* Center Gallery Area */
        .gallery-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
            align-items: center;
            /* Center the grid wrapper */
            justify-content: center;
            /* Vertically center the square */
        }

        /* Tabs styling */
        .gallery-tabs {
            display: flex;
            justify-content: flex-end;
            /* Align right next to title */
            align-items: center;
            background: transparent;
        }

        .gallery-tabs button {
            background: none;
            border: none;
            font-size: 16px;
            /* 16px requested */
            color: #999;
            cursor: pointer;
            transition: color 0.3s;
            padding: 0 15px;
            outline: none;
        }

        .gallery-tabs button.active {
            color: #333;
            font-weight: 500;
        }

        .gallery-tabs .tab-divider {
            width: 1px;
            height: 16px;
            background: #ccc;
            margin: 0 5px;
        }

        /* Scrollable Container - Wider and fixed height for horizontal scroll */
        .galleries-container {
            flex: none;
            /* Do not flex, we want a strict height */
            position: relative;
            overflow: hidden;
            width: 95%;
            max-width: 1600px;
            /* Wider to accommodate more images */
            height: clamp(400px, 70vh, 800px);
            /* Strictly defined height so flex-column wraps */
            margin: 0 auto 10px auto;
            border: 1px solid #eee;
            box-sizing: border-box;
        }

        .gallery-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 5px;

            /* CSS Grid for predictable alternating masonry pattern */
            display: grid;
            grid-template-rows: repeat(2, calc(50% - 2.5px));
            /* Force exactly 50% height rows minus half the 5px gap */
            grid-auto-flow: column;
            /* Fill column by column left-to-right */
            grid-auto-columns: max-content;
            /* Size column to fit explicit item widths */
            gap: 5px;
            /* Tighter gap as requested */

            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
            /* Scrollbar styling for inner grid */
            scrollbar-width: thin;
            scrollbar-color: #ccc transparent;
        }

        .gallery-grid::-webkit-scrollbar {
            height: 6px;
            /* Horizontal scrollbar height */
        }

        .gallery-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .gallery-grid::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 10px;
        }

        .gallery-grid.active {
            opacity: 1;
            visibility: visible;
        }

        /* Alternating grid masonry layout */
        .gallery-grid>a {
            display: flex;
            /* Flex context to force img stretch */
            box-sizing: border-box;
            height: 100%;
            /* Fill the grid row */
            aspect-ratio: 1 / 1;
            /* Force perfect squares for the 2 verticals */
            width: auto;
            overflow: hidden;
            /* Prevent image overflow from breaking cell */
        }

        /* 
           Pattern: 1 complete, 2 verticals 
           3 items per cycle: 3n+1 is complete, 3n+2 and 3n+3 are verticals
        */

        /* 1 complete (spans 2 full rows, wide column) */
        .gallery-grid>a:nth-child(3n+1) {
            grid-row: span 2;
            aspect-ratio: 1 / 1;
            /* Large perfect square tying seamlessly into the 2 stacked smaller squares */
            width: auto;
        }

        .gallery-grid img {
            flex: 1;
            min-height: 0;
            min-width: 0;
            width: 100%;
            height: 100%;
            /* Let natural aspect ratio define height */
            display: block;
            border-radius: 4px;
            /* Slight polish */
            object-fit: cover;
            cursor: pointer;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .gallery-grid img:hover {
            filter: brightness(0.85);
            transform: scale(1.05);
            /* Magnify effect */
        }

        /* Bottom Slider wrapper */
        .subpage-main .projects-wrapper {
            flex-shrink: 0;
            height: 100px;
            /* Restored to exactly 100px */
            overflow: hidden;
            display: flex;
            align-items: center;
            margin-top: 10px;
            background: #fff;
        }

        .bottom-gallery-track {
            display: flex;
            height: 100%;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            align-items: center;
            scrollbar-width: none;
            /* Hide scrollbar */
        }

        .bottom-gallery-track::-webkit-scrollbar {
            display: none;
        }

        /* Override global work_item height for this subpage */
        .subpage-main .work_item {
            height: 100px !important;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
        }

        /* Ensure link wrapper propagates height */
        .subpage-main .work_item a {
            display: block;
            height: 100%;
        }

        /* Ensure images inside shrink proportionally without cropping top/bottom */
        .subpage-main .work_item img {
            height: 100% !important;
            width: auto !important;
            /* Width auto ensures aspect-ratio constraint dynamically pulls in the sides */
            object-fit: contain !important;
            display: block !important;
            cursor: pointer;
            /* 'contain' fits entire image completely visible inside the 100px height limit */
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        /* Restore slider hover darkening and add zoom */
        .subpage-main .work_item:hover img {
            filter: brightness(0.4);
            transform: scale(1.05) !important;
        }

        /* Mobile specific adjustments */

            .subpage-main .projects-wrapper,
            .subpage-main .projects_wrapper,
            .projects-wrapper,
            .projects_wrapper {
                display: none !important;
                /* Hide bottom slider on mobile safely */
            }

            .galleries-container {
                margin-bottom: 0 !important;
                /* remove bottom margin when slider is hidden */
            }
        }

    <!-- TAB SWITCHING SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.tab-btn');
            const grids = document.querySelectorAll('.gallery-grid');

            // --- Hash Routing Logic ---
            const activateTabFromHash = () => {
                const hash = window.location.hash;
                if (hash) {
                    const targetBtn = document.querySelector(`.tab-btn[data-target="gallery-${hash.substring(1)}"]`);
                    if (targetBtn) {
                        targetBtn.click();
                    }
                }
            };

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Remove active from all tabs & grids
                    tabs.forEach(t => t.classList.remove('active'));
                    grids.forEach(g => g.classList.remove('active'));

                    // Add active to targeted tab & grid
                    tab.classList.add('active');
                    const targetId = tab.getAttribute('data-target');
                    document.getElementById(targetId).classList.add('active');

                    // Update URL hash without jumping page
                    history.replaceState(null, null, '#' + targetId.replace('gallery-', ''));
                });
            });

            // Listen to browser forward/back or cross-page hash changes
            window.addEventListener('hashchange', activateTabFromHash);

            // Trigger immediately if a user arrives via a hash link
            activateTabFromHash();

            // True Seamless Infinite Scrolling (Cloned DOM approach)
            grids.forEach(grid => {
                // 1. Clone the content to make it infinitely scrollable without visual breaks
                const originalContent = grid.innerHTML;
                grid.innerHTML = originalContent + originalContent; // Double the items

                // Prevent native image drag breaking JS mouseup dragging
                grid.addEventListener('dragstart', (e) => e.preventDefault());

                // Wait for layout calculation
                setTimeout(() => {
                    // Re-initialize GLightbox for newly cloned links
                    if (typeof GLightbox !== 'undefined') {
                        GLightbox({ selector: '.glightbox' });
                    }

                    // 2. Variables for dragging and boundaries
                    let isDown = false;
                    let isDragging = false;
                    let startX;
                    let scrollLeftStart;
                    let velocity = 0;
                    let prevMouseX = 0;
                    let prevTime = 0;

                    const halfScrollWidth = grid.scrollWidth / 2;
                    // Start right in the exact middle so we can scroll left or right immediately
                    grid.scrollLeft = halfScrollWidth;

                    let exactScrollLeft = grid.scrollLeft;

                    // 3. The invisible bounding box reset and momentum loop
                    const momentumLoop = () => {
                        // Ease towards the target (momentum deceleration)
                        if (!isDown) {
                            if (Math.abs(velocity) > 0.1) {
                                velocity *= 0.98; // 0.98 = Takes even longer to stop!
                                exactScrollLeft -= velocity;
                                grid.scrollLeft = exactScrollLeft; // Let browser natively handle sub-pixel numbers
                            } else {
                                velocity = 0;
                            }
                        }

                        // Teleport Logic (Seamless Loop)
                        const maxGridScroll = grid.scrollWidth - grid.clientWidth;

                        if (exactScrollLeft <= 0) {
                            exactScrollLeft += halfScrollWidth;
                            grid.scrollLeft = exactScrollLeft;
                            scrollLeftStart += halfScrollWidth; // Adjust drag origin so we don't snap back
                        }
                        else if (exactScrollLeft >= maxGridScroll - 5) {
                            exactScrollLeft -= halfScrollWidth;
                            grid.scrollLeft = exactScrollLeft;
                            scrollLeftStart -= halfScrollWidth; // Adjust drag origin so we don't snap back
                        }

                        requestAnimationFrame(momentumLoop);
                    };
                    requestAnimationFrame(momentumLoop);

                    // Prevent click opening lightbox if dragging
                    grid.addEventListener('click', (e) => {
                        if (isDragging) {
                            e.preventDefault();
                            e.stopPropagation();
                        }
                    }, true);

                    // 4. Mouse Dragging
                    grid.addEventListener('mousedown', (e) => {
                        isDown = true;
                        isDragging = false;
                        grid.style.cursor = 'grabbing';
                        startX = e.pageX - grid.offsetLeft;
                        scrollLeftStart = exactScrollLeft;
                        velocity = 0; // stop immediately on touch
                        prevMouseX = startX;
                        prevTime = Date.now();
                    });

                    grid.addEventListener('mouseleave', () => {
                        isDown = false;
                        grid.style.cursor = 'pointer';
                        if (Date.now() - prevTime > 50) velocity = 0;
                    });

                    grid.addEventListener('mouseup', () => {
                        isDown = false;
                        grid.style.cursor = 'pointer';
                        if (Date.now() - prevTime > 50) velocity = 0;
                    });

                    grid.addEventListener('mousemove', (e) => {
                        if (!isDown) return;
                        e.preventDefault();
                        const x = e.pageX - grid.offsetLeft;
                        const walk = (x - startX) * 2; // scroll speed multiplier

                        if (Math.abs(walk) > 5) {
                            isDragging = true; // Mark as drag if moved more than 5px
                        }

                        exactScrollLeft = scrollLeftStart - walk;
                        grid.scrollLeft = exactScrollLeft;

                        let now = Date.now();
                        let dt = now - prevTime;
                        if (dt > 0) {
                            // Calculate current velocity of your hand gesture
                            // Reduced sensitivity by another 20% (4.5 -> 3.6)
                            velocity = ((x - prevMouseX) / dt) * 3.6;
                        }
                        prevTime = now;
                        prevMouseX = x;
                    });

                    // 5. Mouse Wheel (Reversed natural curved scroll + momentum)
                    grid.addEventListener('wheel', (e) => {
                        if (e.deltaY !== 0) {
                            e.preventDefault();
                            // Reduced wheel sensitivity by another 20% (0.045 -> 0.036)
                            // Changed subtraction to addition to reverse the scroll direction
                            velocity += (e.deltaY * 0.036);
                        }
                    }, { passive: false });
                }, 100);
            });

            // Bottom Slider Continuous Autoplay Clone Approach
            const bottomTrack = document.getElementById('bottom-track');
            if (bottomTrack) {
                // Prevent image native drag
                bottomTrack.addEventListener('dragstart', (e) => e.preventDefault());

                const originalBottomHTML = bottomTrack.innerHTML;
                bottomTrack.innerHTML = originalBottomHTML + originalBottomHTML; // Double items

                // Wait for layout calculation and image load
                setTimeout(() => {
                    if (typeof GLightbox !== 'undefined') {
                        GLightbox({ selector: '.glightbox' });
                    }

                    // Force browser to calculate width AFTER cloned images render
                    const images = bottomTrack.querySelectorAll('img');
                    let imagesLoaded = 0;

                    const initializeSlider = () => {
                        const halfScrollWidth = bottomTrack.scrollWidth / 2;
                        bottomTrack.scrollLeft = halfScrollWidth; // Start in middle

                        // Bottom Slider Interaction State
                        let isDown = false;
                        let isDragging = false;
                        let startX;
                        let scrollLeftStart;
                        let velocity = 0;
                        let prevMouseX = 0;
                        let prevTime = 0;

                        let exactScrollLeft = bottomTrack.scrollLeft;

                        // Unified Momentum + Autoplay Loop
                        const momentumLoop = () => {
                            // ALWAYS apply constant baseline flow (conveyor belt)
                            if (!isDown) { // Only drift if NOT holding it, otherwise it fights the user's cursor
                                exactScrollLeft += 0.25;
                            }

                            if (!isDown) {
                                if (Math.abs(velocity) > 0.1) {
                                    // Fling Momentum Physics
                                    velocity *= 0.98;
                                    exactScrollLeft -= velocity;
                                    bottomTrack.scrollLeft = exactScrollLeft;
                                } else {
