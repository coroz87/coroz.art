        body {

        .top-header-area {

        .gallery-area {

            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
            align-items: center;
            justify-content: center;
        }

        .gallery-tabs {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background: transparent;
        }

        .gallery-tabs button {
            background: none;
            border: none;
            font-size: 19px;
            color: #999;
            cursor: pointer;
            transition: color 0.3s;
            padding: 0 15px;
            outline: none;
        }

        .gallery-tabs button.active {
            color: #333;
            font-weight: 500;
        }

        .gallery-tabs .tab-divider {
            width: 1px;
            height: 16px;
            background: #ccc;
            margin: 0 5px;
        }

        .galleries-clip {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1170px;
            margin: 0 auto 10px auto;
            padding: 10px 15px;
            box-sizing: border-box;
        }

        .galleries-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            border: none;
            box-sizing: border-box;
        }

        .gallery-arrow {
            display: none;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            width: 50px;
            height: 50px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 32px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: text-shadow 0.2s, transform 0.2s;
        }

        .gallery-arrow:hover {
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            transform: translateY(-50%) scale(1.15);
        }

        .gallery-arrow.arrow-left {
            left: -50px;
        }

        .gallery-arrow.arrow-right {
            right: -50px;
        }

        @media (max-width: 1300px) {
            .gallery-arrow.arrow-left {
                left: 0px;
            }

            .gallery-arrow.arrow-right {
                right: 0px;
            }
        }

        @media (min-width: 769px) {
            .gallery-arrow {
                display: inline-flex;
            }
        }

        .gallery-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 0;
            display: grid;
            grid-template-rows: repeat(2, calc(50% - 2.5px));
            grid-auto-flow: column;
            grid-auto-columns: max-content;
            gap: 5px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .gallery-grid.active.grid-loaded {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        .gallery-grid>a {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 3/2;
            overflow: hidden;
            background: #f0f0f0;
        }

        .gallery-grid>a:nth-child(3n+1) {
            grid-row: span 2;
            width: auto;
        }

        .gallery-grid>a:nth-child(3n+1) img {
            width: auto;
            height: 100%;
            object-fit: contain;
            background: #f0f0f0;
        }

        .gallery-grid img {
            flex: 1;
            min-height: 0;
            min-width: 0;
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 4px;
            object-fit: contain;
            background: #f0f0f0;
            cursor: pointer;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        @media (hover: hover) {
            .gallery-grid img:hover {
                transform: scale(1.05);
            }
        }

        .subpage-main .projects-wrapper {
            flex-shrink: 0;
            height: 100px;
            overflow: hidden;
            display: flex;
            align-items: center;
            margin-top: 10px;
            background: #fff;
        }

        .bottom-gallery-track {
            display: flex;
            height: 100%;
            gap: 8px;
            padding: 4px 0;
            overflow: hidden;
        }

        .work_item {
            flex-shrink: 0;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .work_item img {
            height: 100%;
            width: auto;
            object-fit: cover;
            border-radius: 3px;
            display: block;
        }

        @media (max-width: 768px) {
            body {

                top: auto;
                left: auto;
                right: auto;

                width: 100%;
                height: 100%;
                border: none;
                overflow: hidden;
                position: relative;
            }

            .gallery-grid {

            }

            .gallery-grid.active {
                display: flex;
                flex-wrap: wrap;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                overflow-x: hidden;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                gap: 5px;
                padding: 0;
                box-sizing: border-box;
                align-content: flex-start;
            }

            .gallery-grid.active>a {
                width: calc(50% - 2.5px);
                height: auto;
                aspect-ratio: unset;
                overflow: hidden;
                background: #f0f0f0;
                display: flex;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
            }

            .gallery-grid.active>a:nth-child(5n+1) {
                width: 100%;
                height: auto;
            }

            .gallery-grid.active>a img {
                width: 100%;
                height: auto;
                object-fit: contain;
            }

            .top-header-area {
                flex-direction: column;
                align-items: flex-start;
                padding: 20px 0 12px 0;
                gap: 18px;
            }

            .gallery-tabs {
                justify-content: center;
                width: 100%;
            }

            .gallery-tabs button {
                font-size: 18px;
                padding: 0 18px;
            }
